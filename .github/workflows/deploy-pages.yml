name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-pages.yml
      - web/towfast-web/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Require the public API URL
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "Configure the repository Actions variable API_BASE_URL with the deployed HTTPS API URL." >&2
            exit 1
          fi
      - name: Install dependencies
        working-directory: web/towfast-web
        run: pnpm install --frozen-lockfile
      - name: Build Angular application
        working-directory: web/towfast-web
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: pnpm exec ng build --base-href "${BASE_PATH}/"
      - name: Write public runtime configuration
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          GOOGLE_MAPS_API_KEY: ${{ vars.GOOGLE_MAPS_API_KEY }}
          GOOGLE_MAPS_MAP_ID: ${{ vars.GOOGLE_MAPS_MAP_ID }}
        run: |
          node --input-type=module <<'EOF'
          import { rmSync, writeFileSync } from 'node:fs';
          const output = 'web/towfast-web/dist/towfast-web/browser';
          const config = {
            apiBaseUrl: process.env.API_BASE_URL,
            googleMapsApiKey: process.env.GOOGLE_MAPS_API_KEY ?? '',
            googleMapsMapId: process.env.GOOGLE_MAPS_MAP_ID ?? '',
            trackingIntervalMs: 10000,
          };
          rmSync(`${output}/config.local.json`, { force: true });
          writeFileSync(`${output}/config.json`, `${JSON.stringify(config, null, 2)}\n`);
          EOF
      - name: Add SPA route fallback
        run: cp web/towfast-web/dist/towfast-web/browser/index.html web/towfast-web/dist/towfast-web/browser/404.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/towfast-web/dist/towfast-web/browser
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
